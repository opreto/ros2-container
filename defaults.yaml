# Default values for every generator option. `generate.sh init` writes a starter
# config with all of them filled in.
#
# Your config file (ros2-container.yaml) is deep-merged over the generator's defaults.yaml:
#   - maps merge key by key, so you only need to set what you change;
#   - lists REPLACE the default list entirely;
#   - unknown keys are an error (to catch typos), except inside free-form maps
#     (dependencies.apt, dependencies.ros, extra.env, extra.dockerfile_env,
#     bash.aliases, editor.settings) whose keys are yours to choose.
#
# Relative paths chain from your config file:
#   output.root, rosdep.rules_file   relative to the directory of your config file
#                                    (the last one, when you pass several -c files)
#   workspace.host_path              relative to output.root
#   workspace.ros_ws_subdir          relative to workspace.host_path, which the
#                                    container sees at workspace.container_path
# The common case is all three set to `.`: the config sits at the repo root, the
# generated folders go there too, and the whole repo is the colcon workspace.

project:
  name: my-robot                    # slug: image, container and compose project names
  display_name: My Robot            # shown in the VS Code dev container picker

output:
  root: .                           # where generated folders go (relative to the config file's directory)
  docker_dir: Docker                # .devcontainer/ and .vscode/ are always at the root

ros:
  distro: lyrical
  # {distro} is substituted. The official `ros` images are multi-arch (amd64 + arm64,
  # so native on Apple Silicon); osrf/ros:*-desktop images are amd64-only.
  base_image: "ros:{distro}-ros-base"
  domain_id: 0

workspace:
  host_path: .                      # folder bind-mounted into the container (relative to output root)
  container_path: /ros2_ws          # where it is mounted
  ros_ws_subdir: .                  # colcon workspace (contains src/), relative to host_path, e.g. ros2_ws

dependencies:
  # apt packages, one cached `RUN apt-get install` per named group, in order.
  # Set a group to [] to drop it.
  apt:
    Developer Utilities: [git-lfs, wget, htop, iputils-ping, tree, gdb, clangd]
    Linters and Formatters: [clang-format, clang-tidy]
  # ROS packages by short name, installed as ros-<distro>-<name> (underscores
  # become dashes). Names that already start with "ros-" are used as-is.
  # `desktop` adds RViz, rqt and the demos (what the *-desktop images contain).
  ros:
    ROS Desktop: [desktop]
  # pip requirement specifiers, written to Docker/python-requirements.txt.
  pip: []
  # Packages pip builds from source instead of installing a wheel (pip install --no-binary <pkg>),
  # e.g. [pybullet], so its EGL renderer links the Mesa libraries installed by apt.
  pip_source_builds: []

rmw:
  implementation: rmw_cyclonedds_cpp   # or rmw_fastrtps_cpp, rmw_zenoh_cpp, ...
  # CycloneDDS only: interfaces DDS may use. Loopback-only keeps discovery
  # traffic off robot/camera NICs; add a LAN interface to talk to other hosts,
  # e.g. {name: eth0, multicast: true}.
  cyclonedds_interfaces:
    - {name: lo, multicast: true}

display:
  x11: true                         # Linux hosts: forward the host X11 display
  mesa_dri: true                    # Linux hosts: pass /dev/dri (Intel/AMD GPU via Mesa)
  nvidia: true                      # Linux hosts: extra variant using the NVIDIA container toolkit; enable this on computers with NVIDIA graphics cards
  wslg: true                        # Windows hosts: use WSLg's built-in X11/Wayland server
  vnc:                              # macOS (or any host): virtual desktop served via noVNC
    enabled: true
    password: changeme              # to change: edit, run generate.sh, then compose-up.sh up -d (no image rebuild)
    geometry: 1920x1080
    novnc_port: 6080

host:                               # Linux overlay only
  # Privileged mode plus the host's /dev: every device, including raw disks, and
  # hot-plugged USB. Prefer listing specific devices in extra.devices.
  hardware_access: false
  network_mode: host                # devices on the LAN

extra:                              # escape hatches (all empty by default)
  # Extra compose bind mounts, added to the base compose file (all variants).
  #   volumes: ["/opt/vendor_sdk:/opt/vendor_sdk:ro", "~/datasets:/data"]
  volumes: []
  # Extra runtime env vars (compose `environment:`, all variants).
  #   env: {LD_LIBRARY_PATH: /opt/vendor_sdk/lib}
  env: {}
  # Specific devices to pass through (Linux and WSLg; not needed with host.hardware_access).
  #   devices: ["/dev/ttyUSB0:/dev/ttyUSB0", "/dev/video0:/dev/video0"]
  devices: []
  # Raw shell commands, each appended as one RUN line at the end of the Dockerfile.
  run: []
  # Build-time ENV lines in the Dockerfile (baked into the image, visible to later RUN steps).
  #   dockerfile_env: {VENDOR_SDK_ROOT: /opt/vendor_sdk}
  dockerfile_env: {}

rosdep:
  # Custom rosdep rules, copied into Docker/ and registered in the image.
  #   rules_file: rosdep/my_rules.yaml
  rules_file: null

bash:
  # Team-wide aliases for the container shell. Personal ones go in Docker/.bashrc_personal.
  #   aliases: {gitst: git status}
  aliases: {}

build:
  cmake_args: -DCMAKE_BUILD_TYPE=Release
  merge_compile_commands: true      # merge build/*/compile_commands.json for clangd/IntelliSense
  post_build_hook: null             # shell command run in the workspace after each `cb`

test:
  # Folders (relative to the colcon workspace) whose packages `ct` doesn't test,
  # e.g. vendored code you don't maintain. Ignored when you scope packages yourself
  # (ct -- --packages-select ...).
  #   skip_paths: [src/external]
  skip_paths: []

ide:
  pyright_config: true              # write pyrightconfig.json (Python import paths) in the container after each build

editor:
  enabled: true                     # emit .devcontainer/ and .vscode/
  editors: [vscode]                 # vscode and/or cursor
  extensions:
    common:
      - ms-vscode.cmake-tools
      - ms-vscode.cpptools-themes
      - ranch-hand-robotics.rde-ros-2
      - ranch-hand-robotics.urdf-editor
      - redhat.vscode-xml
      - xaver.clang-format
      - charliermarsh.ruff
    vscode:
      - ms-python.python
      - ms-python.debugpy
      - ms-vscode.cpptools
      - ms-vscode.cpptools-extension-pack
    cursor:
      - anysphere.cursorpyright
      - anysphere.cpptools
  settings:                         # merged into .vscode/settings.json
    files.associations: {"*.xacro": xml, "*.launch": xml, "*.urdf": xml, "*.sdf": xml}
    files.watcherExclude: {"**/build/**": true, "**/install/**": true, "**/log/**": true}
    search.exclude: {"**/build": true, "**/install": true, "**/log": true}
  post_create_command: rosdep update && git submodule update --init --recursive
